<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing accents -->
    <radialGradient id="glowCyan" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCoral" cx="30%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Cyan Marble Shader -->
    <radialGradient id="marbleCyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#22d3ee" />
      <stop offset="85%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#164e63" />
    </radialGradient>

    <!-- 3D Coral Marble Shader -->
    <radialGradient id="marbleCoral" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fecdd3" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="85%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>

    <!-- 3D Gold Marble Shader -->
    <radialGradient id="marbleGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(4deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-3deg); }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      .floating-1 { animation: float1 5s ease-in-out infinite; transform-origin: center; }
      .floating-2 { animation: float2 6s ease-in-out infinite; transform-origin: center; }
      .pulse { animation: pulseRing 4s ease-in-out infinite; transform-origin: center; }
      .title-font { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 900; }
      .sub-font { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; }
      .mono-font { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <!-- Deep Velvet Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="120" r="280" fill="url(#glowCyan)" />
  <circle cx="200" cy="300" r="260" fill="url(#glowCoral)" />

  <!-- Cyber Grid Lines Background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Arena Ring Graphic Behind -->
  <g class="pulse" opacity="0.25">
    <ellipse cx="600" cy="210" rx="520" ry="160" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8 8" />
    <ellipse cx="600" cy="210" rx="420" ry="120" fill="none" stroke="#f43f5e" stroke-width="1.5" />
  </g>

  <!-- LEFT MARBLES CLUSTER (Coral / Red) -->
  <g class="floating-1" filter="url(#shadow)">
    <!-- Shadow ellipses -->
    <ellipse cx="230" cy="270" rx="42" ry="18" fill="#000" opacity="0.4" />
    <ellipse cx="140" cy="180" rx="32" ry="14" fill="#000" opacity="0.4" />
    
    <!-- Main Big Coral Marble -->
    <circle cx="230" cy="220" r="46" fill="url(#marbleCoral)" />
    <!-- Glass Highlight -->
    <ellipse cx="215" cy="200" rx="14" ry="9" fill="#ffffff" opacity="0.8" transform="rotate(-20 215 200)" />
    
    <!-- Small Coral Marble -->
    <circle cx="140" cy="140" r="34" fill="url(#marbleCoral)" />
    <ellipse cx="128" cy="126" rx="10" ry="6" fill="#ffffff" opacity="0.8" transform="rotate(-20 128 126)" />

    <!-- Label Pill -->
    <rect x="150" y="295" width="130" height="28" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="215" y="314" text-anchor="middle" fill="#f43f5e" class="mono-font" font-size="12" letter-spacing="1.5">LEO (AI)</text>
  </g>

  <!-- RIGHT MARBLES CLUSTER (Cyan / Blue) -->
  <g class="floating-2" filter="url(#shadow)">
    <!-- Shadow ellipses -->
    <ellipse cx="970" cy="270" rx="42" ry="18" fill="#000" opacity="0.4" />
    <ellipse cx="1060" cy="180" rx="32" ry="14" fill="#000" opacity="0.4" />

    <!-- Main Big Cyan Marble -->
    <circle cx="970" cy="220" r="46" fill="url(#marbleCyan)" />
    <ellipse cx="955" cy="200" rx="14" ry="9" fill="#ffffff" opacity="0.8" transform="rotate(-20 955 200)" />

    <!-- Small Cyan Marble -->
    <circle cx="1060" cy="140" r="34" fill="url(#marbleCyan)" />
    <ellipse cx="1048" cy="126" rx="10" ry="6" fill="#ffffff" opacity="0.8" transform="rotate(-20 1048 126)" />

    <!-- Label Pill -->
    <rect x="915" y="295" width="130" height="28" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5" />
    <text x="980" y="314" text-anchor="middle" fill="#22d3ee" class="mono-font" font-size="12" letter-spacing="1.5">YOU (PLAYER)</text>
  </g>

  <!-- CENTER FLOATING GOLD MARBLE (The Prize) -->
  <g class="floating-1" filter="url(#shadow)">
    <circle cx="600" cy="95" r="28" fill="url(#marbleGold)" />
    <ellipse cx="590" cy="84" rx="9" ry="5" fill="#ffffff" opacity="0.85" transform="rotate(-20 590 84)" />
  </g>

  <!-- CENTER BRAND TYPOGRAPHY -->
  <!-- Top Category Tag -->
  <rect x="500" y="140" width="200" height="26" rx="13" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" opacity="0.9" />
  <text x="600" y="157" text-anchor="middle" fill="#fbbf24" class="mono-font" font-size="11" letter-spacing="3">GGANBU DUEL ENGINE</text>

  <!-- MAIN TITLE -->
  <text x="600" y="222" text-anchor="middle" class="title-font" font-size="58" letter-spacing="4" fill="#ffffff" filter="url(#shadow)">
    THE <tspan fill="#22d3ee">MARBLE</tspan>
  </text>

  <!-- SUBTITLE -->
  <text x="600" y="260" text-anchor="middle" class="sub-font" font-size="16" fill="#94a3b8" letter-spacing="1.2">
    A Psychological Game of Wits, Probability &amp; Deception
  </text>

  <!-- TECH STACK BADGES ROW -->
  <g transform="translate(370, 295)">
    <!-- Badge 1: Java 21 -->
    <g transform="translate(0, 0)">
      <rect width="105" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#f59e0b" />
      <text x="28" y="20" fill="#f1f5f9" class="sub-font" font-size="12">Java 21</text>
    </g>

    <!-- Badge 2: Web Audio API -->
    <g transform="translate(115, 0)">
      <rect width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#22d3ee" />
      <text x="28" y="20" fill="#f1f5f9" class="sub-font" font-size="12">Web Audio API</text>
    </g>

    <!-- Badge 3: Dual Platform -->
    <g transform="translate(255, 0)">
      <rect width="125" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#f43f5e" />
      <text x="28" y="20" fill="#f1f5f9" class="sub-font" font-size="12">Desktop + Web</text>
    </g>

    <!-- Badge 4: Zero Dependencies -->
    <g transform="translate(390, 0)">
      <rect width="70" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#10b981" />
      <text x="28" y="20" fill="#f1f5f9" class="sub-font" font-size="12">100%</text>
    </g>
  </g>

  <!-- Bottom Corner Watermark / Story -->
  <text x="40" y="390" fill="#475569" class="mono-font" font-size="12">ORIGIN: 11TH GRADE PROJECT</text>
  <text x="1160" y="390" text-anchor="end" fill="#475569" class="mono-font" font-size="12">EVOLVED BY DHRUV</text>
</svg>

